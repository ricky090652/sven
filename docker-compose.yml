# ============================================================
# Docker Compose 設定檔
# ============================================================
# docker-compose.yml 是用來「描述如何啟動 container」的設定檔。
# 如果 Dockerfile 是「怎麼蓋房子」，
# docker-compose.yml 就是「怎麼住進去」（設定門牌、水電、停車位等）。
# ============================================================

services:
  sven:
    # --------------------------------------------------------
    # build：告訴 Docker 用當前目錄的 Dockerfile 來建 image
    # --------------------------------------------------------
    build:
      context: .           # 「.」代表當前目錄（sven/ 資料夾）
      dockerfile: Dockerfile

    # --------------------------------------------------------
    # container_name：給你的 container 取一個名字
    # --------------------------------------------------------
    # 之後可以用 docker exec -it sven-314581038 bash 進入
    container_name: sven-314581038

    # --------------------------------------------------------
    # stdin_open + tty：讓 container 保持互動模式
    # --------------------------------------------------------
    # 就像打開一個終端機一樣，可以讓你進去打指令
    stdin_open: true    # 等同於 docker run -i
    tty: true           # 等同於 docker run -t

    # --------------------------------------------------------
    # volumes：掛載目錄（最重要的設定之一！）
    # --------------------------------------------------------
    # 格式：「你電腦上的路徑:container 裡面的路徑」
    #
    # 為什麼需要這個？
    # Container 裡面的檔案預設是「隔離的」，你在 container 裡
    # 改的東西，外面看不到。volumes 就像開一個「共用資料夾」，
    # 讓 container 裡外可以互通。
    #
    # ⚠️ 請根據 server 上的實際路徑修改左邊的部分！
    volumes:
      # 掛載專案目錄（這樣你改 code 不用重建 container）
      - .:/workspace

      # 掛載 huggingface cache（避免重複下載模型）
      - ~/.cache/huggingface:/root/.cache/huggingface

    # --------------------------------------------------------
    # deploy.resources：分配 GPU 資源
    # --------------------------------------------------------
    # 這告訴 Docker 讓 container 可以使用 GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # ------------------------------------------------
              # device_ids：指定要用哪張 GPU
              # ------------------------------------------------
              # 在 server 上先用 nvidia-smi 看哪張 GPU 沒人用
              # 然後改這裡的數字。例如：
              #   ["0"]     → 只用第 0 張 GPU
              #   ["1"]     → 只用第 1 張 GPU
              #   ["0","1"] → 用第 0 和第 1 張
              device_ids: ["0"]
              capabilities: [gpu]

    # --------------------------------------------------------
    # shm_size：共享記憶體大小
    # --------------------------------------------------------
    # PyTorch DataLoader 的多 worker 模式需要共享記憶體
    # 預設只有 64MB，訓練時會不夠用，所以設大一點
    shm_size: '8gb'

    # --------------------------------------------------------
    # working_dir：container 啟動時的預設工作目錄
    # --------------------------------------------------------
    working_dir: /workspace
